name: Refresh dynamic GitHub profile
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate README dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit refreshed public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/github-stats.svg assets/featured-projects.svg assets/latest-repositories-v2.svg assets/latest-repositories-hacker.png assets/activity-feed.svg
          if git diff --cached --quiet; then
            echo 'Dashboard already matches the latest GitHub API data.'
            exit 0
          fi
          git commit -m 'chore: refresh live GitHub dashboard [skip ci]'
          # A concurrent profile edit may advance main while the API is being read.
          # Rebase and retry instead of losing a successful refresh.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Live dashboard refreshed successfully.'
              exit 0
            fi
            sleep 3
          done
          echo 'Could not push refreshed dashboard after three attempts.' >&2
          exit 1
