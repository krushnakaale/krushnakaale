name: Refresh dynamic GitHub profile
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate README dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/github-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile dashboard [skip ci]'
            git push
          fi
