name: Refresh dynamic GitHub profile
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Refresh and commit dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_profile.py
            python -c 'import os; from pathlib import Path; from scripts.github_api import GitHubAPI; from scripts.push_streak import refresh; refresh(Path.cwd(), GitHubAPI(os.environ["GH_TOKEN"]), "krushnakaale")'
            python scripts/tech_motion.py
            git add README.md assets/github-stats.svg assets/language-breakdown.svg assets/featured-projects.svg assets/featured-projects-developer.png assets/latest-repositories-v2.svg assets/latest-repositories-hacker.png assets/activity-feed.svg assets/tech-motion.gif assets/push-days.json assets/push-events.json assets/push-streak.svg
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'chore: refresh live GitHub dashboard [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
