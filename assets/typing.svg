<svg xmlns="http://www.w3.org/2000/svg" width="700" height="48" viewBox="0 0 700 48" role="img" aria-label="Python Developer, Cybersecurity Enthusiast, Automation Builder">
<style>.line{opacity:0;animation:cycle 12s steps(1,end) infinite}.a{animation-delay:0s}.b{animation-delay:4s}.c{animation-delay:8s}.cursor{animation:blink .9s steps(2,end) infinite}@keyframes cycle{0%,32%{opacity:1}33%,100%{opacity:0}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.line,.cursor{animation:none}.a{opacity:1}}</style>
<rect width="700" height="48" rx="10" fill="#0B1020" stroke="#263B55"/><g font-family="monospace" font-size="21" text-anchor="middle"><text class="line a" x="350" y="31" fill="#22D3EE">Python Developer</text><text class="line b" x="350" y="31" fill="#A78BFA">Cybersecurity Enthusiast</text><text class="line c" x="350" y="31" fill="#39FF88">Automation Builder</text></g><rect class="cursor" x="565" y="14" width="8" height="21" fill="#22D3EE"/></svg>