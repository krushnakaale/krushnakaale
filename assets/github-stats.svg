<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="292" viewBox="0 0 1100 292" role="img" aria-labelledby="title desc">
<title id="title">Compact live GitHub orbit dashboard</title>
<desc id="desc">Four verified public GitHub metrics in decorative rings and a proportional primary-language strip</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D1D"/><stop offset="1" stop-color="#101C2B"/></linearGradient>
<style>.orbit{animation:orbit 12s linear infinite}@keyframes orbit{to{stroke-dashoffset:-358}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style></defs>
<rect width="1100" height="292" rx="17" fill="url(#bg)"/>
<rect x="1" y="1" width="1098" height="290" rx="16" fill="none" stroke="#344767"/>
<text x="25" y="30" font-family="monospace" font-size="17" font-weight="700" fill="#EAF2FF">GITHUB // LIVE ORBIT</text>
<text x="1074" y="30" text-anchor="end" font-family="monospace" font-size="12" fill="#39FF88">● AUTO REFRESH</text>
<g font-family="Arial,sans-serif"><circle cx="140" cy="112" r="57" fill="#10192B" stroke="#283751" stroke-width="9"/><circle class="orbit" cx="140" cy="112" r="57" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-dasharray="252 358" transform="rotate(-90 140 112)"/><text x="140" y="123" text-anchor="middle" font-size="36" font-weight="800" fill="#22D3EE">11</text><text x="140" y="195" text-anchor="middle" font-size="16" fill="#DAE7F7">Public projects</text><circle cx="410" cy="112" r="57" fill="#10192B" stroke="#283751" stroke-width="9"/><circle class="orbit" cx="410" cy="112" r="57" fill="none" stroke="#A78BFA" stroke-width="9" stroke-linecap="round" stroke-dasharray="252 358" transform="rotate(-90 410 112)"/><text x="410" y="123" text-anchor="middle" font-size="36" font-weight="800" fill="#A78BFA">3</text><text x="410" y="195" text-anchor="middle" font-size="16" fill="#DAE7F7">Project stars</text><circle cx="680" cy="112" r="57" fill="#10192B" stroke="#283751" stroke-width="9"/><circle class="orbit" cx="680" cy="112" r="57" fill="none" stroke="#39FF88" stroke-width="9" stroke-linecap="round" stroke-dasharray="252 358" transform="rotate(-90 680 112)"/><text x="680" y="123" text-anchor="middle" font-size="36" font-weight="800" fill="#39FF88">1</text><text x="680" y="195" text-anchor="middle" font-size="16" fill="#DAE7F7">Project forks</text><circle cx="950" cy="112" r="57" fill="#10192B" stroke="#283751" stroke-width="9"/><circle class="orbit" cx="950" cy="112" r="57" fill="none" stroke="#F472B6" stroke-width="9" stroke-linecap="round" stroke-dasharray="252 358" transform="rotate(-90 950 112)"/><text x="950" y="123" text-anchor="middle" font-size="36" font-weight="800" fill="#F472B6">2</text><text x="950" y="195" text-anchor="middle" font-size="16" fill="#DAE7F7">Followers</text></g>
<rect x="32" y="228" width="1036" height="11" rx="5" fill="#25344C"/>
<g font-family="Arial,sans-serif"><rect x="32.00" y="228" width="518.00" height="11" fill="#22D3EE"/><rect x="550.00" y="228" width="207.20" height="11" fill="#A78BFA"/><rect x="757.20" y="228" width="207.20" height="11" fill="#39FF88"/><rect x="964.40" y="228" width="103.60" height="11" fill="#F472B6"/><circle cx="34" cy="264" r="5" fill="#22D3EE"/><text x="47" y="269" font-size="13" fill="#BFCDE0">JavaScript · 5</text><circle cx="239" cy="264" r="5" fill="#A78BFA"/><text x="252" y="269" font-size="13" fill="#BFCDE0">Python · 2</text><circle cx="444" cy="264" r="5" fill="#39FF88"/><text x="457" y="269" font-size="13" fill="#BFCDE0">HTML · 2</text><circle cx="649" cy="264" r="5" fill="#F472B6"/><text x="662" y="269" font-size="13" fill="#BFCDE0">TypeScript · 1</text></g>
</svg>
