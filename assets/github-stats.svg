<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-labelledby="title desc">
<title id="title">Live GitHub dashboard</title>
<desc id="desc">Public repository counts, stars, forks, followers and repository primary languages</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D1C"/><stop offset="1" stop-color="#101B2B"/></linearGradient>
<style>.bar{animation:grow 1.6s ease-out both;transform-box:fill-box;transform-origin:left center}.signal{animation:pulse 2.4s ease-in-out infinite alternate}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pulse{to{opacity:.25}}@media(prefers-reduced-motion:reduce){.bar,.signal{animation:none}}</style>
</defs>
<rect width="1100" height="465" rx="19" fill="url(#bg)"/>
<rect x="1" y="1" width="1098" height="463" rx="18" stroke="#344765" fill="none"/>
<circle class="signal" cx="27" cy="35" r="6" fill="#39FF88"/>
<text x="43" y="42" font-family="monospace" font-size="23" font-weight="700" fill="#F0F5FF">GITHUB / LIVE METRICS</text>
<text x="1072" y="40" text-anchor="end" font-family="monospace" font-size="13" fill="#22D3EE">GITHUB API · AUTO REFRESH</text>
<g font-family="Arial,sans-serif"><rect x="20" y="75" width="250" height="112" rx="13" fill="#111A2D" stroke="#22D3EE" stroke-opacity=".75"/><rect x="34" y="91" width="4" height="17" rx="2" fill="#22D3EE"/><text x="47" y="105" font-size="16" fill="#C6D5E7">Public projects</text><text x="37" y="161" font-size="39" font-weight="800" fill="#22D3EE">11</text><rect x="290" y="75" width="250" height="112" rx="13" fill="#111A2D" stroke="#A78BFA" stroke-opacity=".75"/><rect x="304" y="91" width="4" height="17" rx="2" fill="#A78BFA"/><text x="317" y="105" font-size="16" fill="#C6D5E7">Project stars</text><text x="307" y="161" font-size="39" font-weight="800" fill="#A78BFA">3</text><rect x="560" y="75" width="250" height="112" rx="13" fill="#111A2D" stroke="#39FF88" stroke-opacity=".75"/><rect x="574" y="91" width="4" height="17" rx="2" fill="#39FF88"/><text x="587" y="105" font-size="16" fill="#C6D5E7">Project forks</text><text x="577" y="161" font-size="39" font-weight="800" fill="#39FF88">1</text><rect x="830" y="75" width="250" height="112" rx="13" fill="#111A2D" stroke="#22D3EE" stroke-opacity=".75"/><rect x="844" y="91" width="4" height="17" rx="2" fill="#22D3EE"/><text x="857" y="105" font-size="16" fill="#C6D5E7">Followers</text><text x="847" y="161" font-size="39" font-weight="800" fill="#22D3EE">2</text></g>
<path d="M21 211H1079" stroke="#33435F"/>
<text x="27" y="237" font-family="monospace" font-size="19" font-weight="700" fill="#A78BFA">TOP LANGUAGES</text>
<text x="1070" y="235" text-anchor="end" font-family="monospace" font-size="12" fill="#A0B0C8">PRIMARY LANGUAGE PER PUBLIC REPOSITORY</text>
<g font-family="Arial,sans-serif"><text x="29" y="258" font-size="16" fill="#E6F0FF">JavaScript</text><rect x="225" y="245" width="735" height="14" rx="7" fill="#243047"/><rect class="bar" x="225" y="245" width="735" height="14" rx="7" fill="#22D3EE"/><text x="1040" y="258" text-anchor="end" font-size="15" fill="#B5C6DD">5</text><text x="29" y="295" font-size="16" fill="#E6F0FF">Python</text><rect x="225" y="282" width="735" height="14" rx="7" fill="#243047"/><rect class="bar" x="225" y="282" width="294" height="14" rx="7" fill="#A78BFA"/><text x="1040" y="295" text-anchor="end" font-size="15" fill="#B5C6DD">2</text><text x="29" y="332" font-size="16" fill="#E6F0FF">HTML</text><rect x="225" y="319" width="735" height="14" rx="7" fill="#243047"/><rect class="bar" x="225" y="319" width="294" height="14" rx="7" fill="#39FF88"/><text x="1040" y="332" text-anchor="end" font-size="15" fill="#B5C6DD">2</text><text x="29" y="369" font-size="16" fill="#E6F0FF">TypeScript</text><rect x="225" y="356" width="735" height="14" rx="7" fill="#243047"/><rect class="bar" x="225" y="356" width="147" height="14" rx="7" fill="#22D3EE"/><text x="1040" y="369" text-anchor="end" font-size="15" fill="#B5C6DD">1</text></g>
<text x="28" y="448" font-family="monospace" font-size="12" fill="#8B9DB8">VERIFIED PUBLIC REPOSITORY METRICS · COUNTS REFRESH WHEN THE WORKFLOW RUNS</text>
</svg>
