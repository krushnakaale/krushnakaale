<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="292" viewBox="0 0 1100 292" role="img" aria-labelledby="title desc">
<title id="title">Single orbit live GitHub dashboard</title>
<desc id="desc">One proportional language distribution circle, surrounded by verified public GitHub metrics</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020A08"/><stop offset="1" stop-color="#071B17"/></linearGradient><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#39FF88" stroke-opacity=".065" stroke-width=".7"/></pattern>
<style>.halo{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{opacity:.25}}.snake-orbit{animation:snakeSpin 8s linear infinite;transform-origin:0 0}.snake-lunge{animation:snakeBite 8s ease-in-out infinite}.snake-jaw{animation:jaw 8s ease-in-out infinite}@keyframes snakeSpin{0%{transform:rotate(0deg)}75%,87%{transform:rotate(300deg)}100%{transform:rotate(360deg)}}@keyframes snakeBite{0%,74%,90%,100%{transform:translateX(0)}81%{transform:translateX(20px)}}@keyframes jaw{0%,74%,85%,100%{opacity:0}78%,82%{opacity:1}}@media(prefers-reduced-motion:reduce){.halo,.snake-orbit,.snake-lunge,.snake-jaw{animation:none}}</style></defs>
<rect width="1100" height="292" rx="18" fill="url(#bg)"/><rect width="1100" height="292" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1098" height="290" rx="17" stroke="#227A50" fill="none"/>
<text x="27" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#EAF2FF">root@github:~# ./live-orbit</text>
<text x="1070" y="28" text-anchor="end" font-family="monospace" font-size="12" fill="#39FF88">[ ● ] API CONNECTED // AUTO-SYNC</text>
<circle class="halo" cx="193" cy="145" r="118" fill="none" stroke="#39FF88" stroke-opacity=".6" stroke-width="2"/>
<circle cx="193" cy="145" r="100" fill="none" stroke="#194330" stroke-width="13"/>
<g><circle cx="193" cy="145" r="100" fill="none" stroke="#39FF88" stroke-width="13" stroke-dasharray="314.159 628.319" stroke-dashoffset="-0.000" transform="rotate(-90 193 145)"/><circle cx="193" cy="145" r="100" fill="none" stroke="#22D3EE" stroke-width="13" stroke-dasharray="125.664 628.319" stroke-dashoffset="-314.159" transform="rotate(-90 193 145)"/><circle cx="193" cy="145" r="100" fill="none" stroke="#A78BFA" stroke-width="13" stroke-dasharray="125.664 628.319" stroke-dashoffset="-439.823" transform="rotate(-90 193 145)"/><circle cx="193" cy="145" r="100" fill="none" stroke="#00E5A0" stroke-width="13" stroke-dasharray="62.832 628.319" stroke-dashoffset="-565.487" transform="rotate(-90 193 145)"/></g>
<circle cx="193" cy="145" r="78" fill="#06140F"/>
<g transform="translate(193 145)">
<g class="snake-orbit">
<path d="M-69 0 A69 69 0 0 1 0 -69 A69 69 0 0 1 63 -28" fill="none" stroke="#123F2A" stroke-width="12" stroke-linecap="round"/>
<path d="M-69 0 A69 69 0 0 1 0 -69 A69 69 0 0 1 63 -28" fill="none" stroke="#39FF88" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 3"/>
<g transform="translate(63 -28) rotate(155)">
<g class="snake-lunge">
<path d="M-10 -9 Q3 -13 15 -5 L18 0 L15 5 Q3 13 -10 9 Z" fill="#39FF88" stroke="#B6FFD4" stroke-width="1"/>
<circle cx="5" cy="-5" r="2" fill="#071A15"/><circle cx="5" cy="5" r="2" fill="#071A15"/>
<path class="snake-jaw" d="M8 0 L19 0 L13 5 Z" fill="#071A15"/>
<path d="M15 -3 L11 0 L15 3" fill="#EAF2FF"/>
</g></g></g></g>
<text x="193" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="#39FF88">11</text>
<text x="193" y="166" text-anchor="middle" font-family="monospace" font-size="13" fill="#8DC7A9">PUBLIC REPOS</text>
<g font-family="Arial,sans-serif"><rect x="410" y="67" width="300" height="67" rx="10" fill="#071A15" stroke="#235E46"/><rect x="410" y="67" width="4" height="67" rx="2" fill="#39FF88"/><text x="427" y="91" font-size="14" fill="#9AC9B2">Public projects</text><text x="427" y="121" font-size="29" font-weight="800" fill="#39FF88">11</text><rect x="740" y="67" width="300" height="67" rx="10" fill="#071A15" stroke="#235E46"/><rect x="740" y="67" width="4" height="67" rx="2" fill="#22D3EE"/><text x="757" y="91" font-size="14" fill="#9AC9B2">Project stars</text><text x="757" y="121" font-size="29" font-weight="800" fill="#22D3EE">3</text><rect x="410" y="151" width="300" height="67" rx="10" fill="#071A15" stroke="#235E46"/><rect x="410" y="151" width="4" height="67" rx="2" fill="#A78BFA"/><text x="427" y="175" font-size="14" fill="#9AC9B2">Project forks</text><text x="427" y="205" font-size="29" font-weight="800" fill="#A78BFA">1</text><rect x="740" y="151" width="300" height="67" rx="10" fill="#071A15" stroke="#235E46"/><rect x="740" y="151" width="4" height="67" rx="2" fill="#00E5A0"/><text x="757" y="175" font-size="14" fill="#9AC9B2">Followers</text><text x="757" y="205" font-size="29" font-weight="800" fill="#00E5A0">3</text><circle cx="420" cy="251" r="5" fill="#39FF88"/><text x="431" y="255" font-size="12" fill="#B6EBD0">JavaScript</text><circle cx="553" cy="251" r="5" fill="#22D3EE"/><text x="564" y="255" font-size="12" fill="#B6EBD0">Python</text><circle cx="686" cy="251" r="5" fill="#A78BFA"/><text x="697" y="255" font-size="12" fill="#B6EBD0">HTML</text><circle cx="819" cy="251" r="5" fill="#00E5A0"/><text x="830" y="255" font-size="12" fill="#B6EBD0">TypeScript</text></g>
<text x="27" y="277" font-family="monospace" font-size="11" fill="#8DA3BE">SYS::OK / LANGUAGE RING = PUBLIC REPO LANGUAGES / SOURCE: GITHUB API</text>
</svg>
