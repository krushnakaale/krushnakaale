<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="292" viewBox="0 0 1100 292" role="img" aria-labelledby="title desc">
<title id="title">Single orbit live GitHub dashboard</title>
<desc id="desc">One proportional language distribution circle, surrounded by verified public GitHub metrics</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D1C"/><stop offset="1" stop-color="#111E30"/></linearGradient>
<style>.halo{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{opacity:.25}}@media(prefers-reduced-motion:reduce){.halo{animation:none}}</style></defs>
<rect width="1100" height="292" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1098" height="290" rx="17" stroke="#354768" fill="none"/>
<text x="27" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#EAF2FF">GITHUB // ONE ORBIT</text>
<text x="1070" y="28" text-anchor="end" font-family="monospace" font-size="12" fill="#39FF88">● LIVE API / AUTO REFRESH</text>
<circle class="halo" cx="193" cy="145" r="118" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2"/>
<circle cx="193" cy="145" r="100" fill="none" stroke="#26334A" stroke-width="13"/>
<g><circle cx="193" cy="145" r="100" fill="none" stroke="#22D3EE" stroke-width="13" stroke-dasharray="314.159 628.319" stroke-dashoffset="-0.000" transform="rotate(-90 193 145)"/><circle cx="193" cy="145" r="100" fill="none" stroke="#A78BFA" stroke-width="13" stroke-dasharray="125.664 628.319" stroke-dashoffset="-314.159" transform="rotate(-90 193 145)"/><circle cx="193" cy="145" r="100" fill="none" stroke="#39FF88" stroke-width="13" stroke-dasharray="125.664 628.319" stroke-dashoffset="-439.823" transform="rotate(-90 193 145)"/><circle cx="193" cy="145" r="100" fill="none" stroke="#F472B6" stroke-width="13" stroke-dasharray="62.832 628.319" stroke-dashoffset="-565.487" transform="rotate(-90 193 145)"/></g>
<circle cx="193" cy="145" r="78" fill="#0B1425"/>
<text x="193" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="#EAF2FF">11</text>
<text x="193" y="166" text-anchor="middle" font-family="monospace" font-size="13" fill="#9EB5D0">PUBLIC REPOS</text>
<g font-family="Arial,sans-serif"><rect x="410" y="67" width="300" height="67" rx="10" fill="#121E32" stroke="#30425D"/><rect x="410" y="67" width="4" height="67" rx="2" fill="#22D3EE"/><text x="427" y="91" font-size="14" fill="#AFC3DB">Public projects</text><text x="427" y="121" font-size="29" font-weight="800" fill="#22D3EE">11</text><rect x="740" y="67" width="300" height="67" rx="10" fill="#121E32" stroke="#30425D"/><rect x="740" y="67" width="4" height="67" rx="2" fill="#A78BFA"/><text x="757" y="91" font-size="14" fill="#AFC3DB">Project stars</text><text x="757" y="121" font-size="29" font-weight="800" fill="#A78BFA">3</text><rect x="410" y="151" width="300" height="67" rx="10" fill="#121E32" stroke="#30425D"/><rect x="410" y="151" width="4" height="67" rx="2" fill="#39FF88"/><text x="427" y="175" font-size="14" fill="#AFC3DB">Project forks</text><text x="427" y="205" font-size="29" font-weight="800" fill="#39FF88">1</text><rect x="740" y="151" width="300" height="67" rx="10" fill="#121E32" stroke="#30425D"/><rect x="740" y="151" width="4" height="67" rx="2" fill="#F472B6"/><text x="757" y="175" font-size="14" fill="#AFC3DB">Followers</text><text x="757" y="205" font-size="29" font-weight="800" fill="#F472B6">2</text><circle cx="420" cy="251" r="5" fill="#22D3EE"/><text x="431" y="255" font-size="12" fill="#C3D3E7">JavaScript</text><circle cx="553" cy="251" r="5" fill="#A78BFA"/><text x="564" y="255" font-size="12" fill="#C3D3E7">Python</text><circle cx="686" cy="251" r="5" fill="#39FF88"/><text x="697" y="255" font-size="12" fill="#C3D3E7">HTML</text><circle cx="819" cy="251" r="5" fill="#F472B6"/><text x="830" y="255" font-size="12" fill="#C3D3E7">TypeScript</text></g>
<text x="27" y="277" font-family="monospace" font-size="11" fill="#8DA3BE">LANGUAGE RING = PRIMARY LANGUAGES OF PUBLIC REPOS · METRICS FROM GITHUB API</text>
